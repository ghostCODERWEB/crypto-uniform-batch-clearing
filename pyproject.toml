[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-uniform-batch-clearing"
version = "0.1.0"
description = "Search integer limit prices for maximum crossing volume and settle price-time allocations at a uniform price."
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
crypto-uniform-batch-clearing = "cryptolab:main"

[tool.setuptools.packages.find]
include = ["cryptolab*"]

[tool.setuptools.package-data]
cryptolab = ["web/*"]
